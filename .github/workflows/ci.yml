name: API Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to test'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - staging
          - production

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        environment: [qa, staging]
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests - ${{ matrix.environment }}
        env:
          NODE_ENV: ${{ matrix.environment }}
          URL_BASE: ${{ matrix.environment == 'qa' && secrets.URL_BASE_QA || secrets.URL_BASE_STAG }}
          URL_BASE_QA: ${{ secrets.URL_BASE_QA }}
          URL_BASE_STAG: ${{ secrets.URL_BASE_STAG }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          TIMEOUT: '60000'
        run: |
          echo "Running tests for ${{ matrix.environment }} environment"
          npm run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.environment }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

      - name: Generate test report
        if: always()
        run: npm run report

      - name: Notify Slack on failure
        if: failure() && secrets.SLACK_WEBHOOK != ''
        run: |
          curl -X POST ${{ secrets.SLACK_WEBHOOK }} \
            -H 'Content-Type: application/json' \
            -d '{
              "text": "❌ API Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Environment:* ${{ matrix.environment }}\n*Branch:* ${{ github.ref_name }}\n*Commit:* ${{ github.sha }}\n*Run:* <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }'

  # Manual environment-specific test run
  test-manual:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests - ${{ inputs.environment }}
        env:
          NODE_ENV: ${{ inputs.environment }}
          URL_BASE: ${{ inputs.environment == 'qa' && secrets.URL_BASE_QA || (inputs.environment == 'staging' && secrets.URL_BASE_STAG || secrets.URL_BASE_PROD) }}
          URL_BASE_QA: ${{ secrets.URL_BASE_QA }}
          URL_BASE_STAG: ${{ secrets.URL_BASE_STAG }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          TIMEOUT: '60000'
        run: npm run test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-manual-${{ inputs.environment }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30