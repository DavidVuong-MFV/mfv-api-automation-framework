name: CI - API BDD Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        env: [qa, stag]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        env:
          NODE_ENV: ${{ matrix.env }}
          # Use secrets instead of hardcoding
          API_BASE_QA: ${{ secrets.API_BASE_QA }}
          API_BASE_STAG: ${{ secrets.API_BASE_STAG }}
          # Select API_BASE cleanly per environment
          API_BASE: ${{ matrix.env == 'qa' && secrets.API_BASE_QA || secrets.API_BASE_STAG }}
        run: |
          echo "Running tests for $NODE_ENV"
          echo "API_BASE=$API_BASE"
          npm test

      - name: Generate HTML report
        if: always()
        run: |
          if [ -f reports/cucumber-report.json ]; then
            npm run report || echo "Report generation failed"
          else
            echo "No cucumber JSON found; skipping report generation"
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.env }}
          path: |
            reports/cucumber-report.json
            reports/cucumber-report.html
            playwright-report/**

      - name: Notify Slack
        if: always()
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          fields: repo,workflow,job,ref
          custom_payload: |
            {
              "attachments": [
                {
                  "color": "${{ job.status == 'success' && '#36a64f' || job.status == 'failure' && '#ff0000' || '#ffae42' }}",
                  "title": "CI: ${{ matrix.env }} — ${{ job.status }}",
                  "text": "Repository: ${{ github.repository }}\nWorkflow: ${{ github.workflow }}\nBranch: ${{ github.ref }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
                  "fields": [
                    {"title":"Environment","value":"${{ matrix.env }}","short":true},
                    {"title":"Job","value":"${{ github.job }}","short":true}
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
